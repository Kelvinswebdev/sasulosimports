<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | Sasulos Imports & Logistics</title>
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>


<form id="registrationForm">

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
    </div>

    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" name="phone" required>
    </div>

    <div class="input-group">
        <label>Country</label>
        <input type="text" id="country" name="country" required>
    </div>

    <div class="input-group">
        <label>Select Course</label>
        <select id="course" name="course" required>
            <option value="">Choose a Course</option>
            <option value="Mini Importation Masterclass">Mini Importation Masterclass</option>
            <option value="Alibaba Product Sourcing">Alibaba Product Sourcing</option>
            <option value="China Importation Strategy">China Importation Strategy</option>
            <option value="Shipping & Logistics Training">Shipping & Logistics Training</option>
            <option value="Importation Business Bootcamp">Importation Business Bootcamp</option>
        </select>
    </div>

    <div class="input-group">
        <label>Why do you want to learn importation?</label>
        <textarea
            id="message"
            name="message"
            rows="4"
        ></textarea>
    </div>

    <button type="submit" id="submitBtn">
        Register Now
    </button>

</form>

    <script>
      const scriptURL =                       
      "https://script.google.com/macros/s/AKfycbykdDvRcy9xNy8ZexO2fDlei3GITStSPXA1jc0zMePMCeKQVVsTze5kexQ3G801hHT4/exec";
      const form = document.forms["submit-to-google-sheet"];
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        var formData = new FormData(form);
        var ex = document.getElementById("ex").checked;
        var age = document.getElementById("age").checked;

        if (age) {
          formData.append("age", "Yes");
        } else {
          formData.append("age", "No");
        }
        if (ex) {
          formData.append("ex", "Yes");
        } else {
          formData.append("ex", "No");
        }

        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            swal("Done", "Submitted Successfully.", "success");
          })
          .catch((error) => {
            swal("Error", "Something went wrong. please try again!", "error");
          });
      });
    </script>


</body>
</html>
