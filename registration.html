<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | Sasulos Imports & Logistics</title>
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <section class="registration-section">
        <div class="container">

            <div class="header-content">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>

                <h1>Payment Successful!</h1>

                <p>
                    Thank you for your payment. Your spot has been reserved.
                    Please complete the registration form below to finalize your enrollment.
                </p>
            </div>

            <div class="form-container">

                <form id="registrationForm">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required>
                        </div>

                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" name="phone" required>
                        </div>

                        <div class="form-group">
                            <label>WhatsApp Number *</label>
                            <input type="tel" name="whatsapp" required>
                        </div>

                        <div class="form-group">
                            <label>City / Region *</label>
                            <input type="text" name="location" required>
                        </div>

                        <div class="form-group">
                            <label>Occupation *</label>
                            <input type="text" name="occupation" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Course Purchased *</label>
                            <select name="course" required>
                                <option value="">Select Course</option>
                                <option>Mini Importation Masterclass</option>
                                <option>Business Coaching & Entrepreneurship</option>
                                <option>Logistics & Supply Chain Management</option>
                                <option>E-Commerce & Online Selling</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Paystack Transaction Reference *</label>
                            <input type="text" name="reference" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Have you imported products before?</label>
                            <select name="experience">
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>What do you hope to learn from this training?</label>
                            <textarea name="expectations" rows="5"></textarea>
                        </div>

                    </div>

                    <button type="submit" class="submit-btn">
                        Complete Registration
                    </button>

                    <div id="successMessage" class="success-message">
                        Registration completed successfully! Our team will contact you shortly.
                    </div>

                </form>

            </div>

        </div>
    </section>

    <script>
        const form = document.getElementById("registrationForm");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(e){
            e.preventDefault();

            // Replace with your Google Apps Script URL
            const scriptURL = "YOUR_GOOGLE_SCRIPT_URL";

            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                whatsapp: form.whatsapp.value,
                location: form.location.value,
                occupation: form.occupation.value,
                course: form.course.value,
                reference: form.reference.value,
                experience: form.experience.value,
                expectations: form.expectations.value
            };

            fetch(scriptURL, {
                method: "POST",
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                successMessage.style.display = "block";
                form.reset();

                setTimeout(() => {
                    window.location.href = "/";
                }, 5000);
            })
            .catch(error => {
                alert("Something went wrong. Please try again.");
            });
        });

        // Auto-fill course from URL
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course');

        if(course){
            document.querySelector('[name="course"]').value = course;
        }
    </script>

</body>
</html>
