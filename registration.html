<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | Sasulos Imports & Logistics</title>
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <section class="registration-section">
        <div class="container">

            <div class="header-content">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>

                <h1>Payment Successful!</h1>

                <p>
                    Thank you for your payment. Your spot has been reserved.
                    Please complete the registration form below to finalize your enrollment.
                </p>
            </div>

            <div class="form-container">

                <form id="submit-to-google-sheet">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required>
                        </div>

                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" name="phone" required>
                        </div>

                        <div class="form-group">
                            <label>WhatsApp Number *</label>
                            <input type="tel" name="whatsapp" required>
                        </div>

                        <div class="form-group">
                            <label>City / Region *</label>
                            <input type="text" name="location" required>
                        </div>

                        <div class="form-group">
                            <label>Occupation *</label>
                            <input type="text" name="occupation" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Course Purchased *</label>
                            <select name="course" required>
                                <option value="">Select Course</option>
                                <option>Mini Importation Masterclass</option>
                                <option>Business Coaching & Entrepreneurship</option>
                                <option>Logistics & Supply Chain Management</option>
                                <option>E-Commerce & Online Selling</option>
                            </select>
                        </div>

                        

                        <div class="form-group full-width">
                            <label>Have you imported products before?</label>
                            <select name="experience">
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>What do you hope to learn from this training?</label>
                            <textarea name="expectations" rows="5"></textarea>
                        </div>

                    </div>

                    <button type="submit" class="submit-btn">
                        Complete Registration
                    </button>

                    <div id="successMessage" class="success-message">
                        Registration completed successfully! Our team will contact you shortly.
                    </div>

                </form>

            </div>

        </div>
    </section>

    <script>
      const scriptURL =                       
      "https://script.google.com/macros/s/AKfycbykdDvRcy9xNy8ZexO2fDlei3GITStSPXA1jc0zMePMCeKQVVsTze5kexQ3G801hHT4/exec";
      const form = document.forms["submit-to-google-sheet"];
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        var formData = new FormData(form);
        var ex = document.getElementById("ex").checked;
        var age = document.getElementById("age").checked;

        if (age) {
          formData.append("age", "Yes");
        } else {
          formData.append("age", "No");
        }
        if (ex) {
          formData.append("ex", "Yes");
        } else {
          formData.append("ex", "No");
        }

        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            swal("Done", "Submitted Successfully.", "success");
          })
          .catch((error) => {
            swal("Error", "Something went wrong. please try again!", "error");
          });
      });
    </script>


</body>
</html>
